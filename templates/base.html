{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}FITGPT{% endblock %}
    </title>

    <!-- Google Fonts: Space Grotesk (display/brand), Inter (body/nav), JetBrains Mono (data/avatar) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>


<body>

<!-- ================= NAVBAR ================= -->

<nav class="main-navbar">

    <div class="navbar-container">

        <!-- Logo -->

        <a href="/" class="brand">

            <span class="brand-icon">
                <svg class="pulse-trace" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h4l1.5-4 3 9 3-14 2.5 9h2.5l1.5-3 1 3H22"/>
                </svg>
            </span>

            <span>FITGPT</span>

        </a>


        <!-- Navigation -->

        <div class="nav-links">

            <a href="/" class="nav-link-custom">
                Home
            </a>


            {% if user.is_authenticated %}

                <a href="{% url 'document_list' %}"
                   class="nav-link-custom">

                    My Documents

                </a>


                <a href="{% url 'upload_document' %}"
                   class="nav-link-custom">

                    Upload

                </a>


                <a href="{% url 'chat_home' %}"
                   class="nav-link-custom ai-nav-link">

                    <span class="ai-pulse-dot"></span>
                    Ask AI

                </a>


                <!-- User -->

                <div class="user-menu">

                    <div class="user-avatar">

                        {{ user.username|first|upper }}

                    </div>

                    <span class="username">

                        {{ user.username }}

                    </span>

                </div>


                <a href="{% url 'logout' %}"
                   class="logout-link">

                    Logout

                </a>

            {% else %}

                <a href="{% url 'login' %}"
                   class="nav-link-custom">

                    Login

                </a>


                <a href="{% url 'register' %}"
                   class="signup-button">

                    Get Started

                </a>

            {% endif %}

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">

    {% block content %}

    {% endblock %}

</main>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
