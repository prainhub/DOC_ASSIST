{% extends "base.html" %}

{% block title %}Upload Document{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <h2 class="mb-4">Upload PDF</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Document Title</label>
            <input
                type="text"
                name="title"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">Choose PDF</label>
            <input
                type="file"
                name="file"
                class="form-control"
                accept=".pdf"
                required>
        </div>

        <button class="btn btn-primary">
            Upload
        </button>

    </form>

</div>

{% endblock %}
