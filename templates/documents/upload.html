{% extends "base.html" %}

{% block title %}Upload Document — DOCASSIST{% endblock %}

{% block content %}

<div class="upload-page">
    <div class="upload-card">

        <h2>Upload Document</h2>

        {% if error %}
            <div class="auth-error" style="margin-bottom:16px;">{{ error }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}

            <label class="auth-label" for="uploadTitle">Document title</label>
            <input type="text" name="title" id="uploadTitle"
                   class="upload-input" placeholder="e.g. My Resume">

            <label class="auth-label" for="uploadFile">File</label>
            <input type="file" name="file" id="uploadFile"
                   class="upload-input" accept=".pdf,.docx,.txt" required>
            <p style="font-size:11.5px; color:var(--text-dim); margin-top:-8px; margin-bottom:16px;">
                Supported: PDF, DOCX, TXT
            </p>

            <button type="submit" class="upload-btn">Upload &amp; Extract</button>

        </form>

        <div style="margin-top:14px; text-align:center;">
            <a href="{% url 'document_list' %}" style="color:var(--text-sec); font-size:13px;">
                ← Back to My Documents
            </a>
        </div>

    </div>
</div>

{% endblock %}
