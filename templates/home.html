{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}

<div class="home-hero">

    <div class="chat-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h4l1.5-4 3 9 3-14 2.5 9h2.5l1.5-3 1 3H22"/>
        </svg>
    </div>

    <div class="home-hero-text">
        <h1>Where should we begin?</h1>
        <p class="text-secondary">
            Sign in to ask questions about your fitness and nutrition documents.
        </p>
    </div>

    <form method="POST" action="{% url 'chat_home' %}" class="home-composer">

        {% csrf_token %}

        <div class="chat-input-row">

            <a href="{% url 'upload_document' %}" class="attach-btn" title="Upload a document">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </a>

            <textarea
                name="question"
                class="form-control chat-textarea"
                rows="1"
                placeholder="Ask anything about your documents..."
                required
            ></textarea>

            <button type="submit" class="chat-send-btn">
                <span class="ai-pulse-dot"></span>
                Ask
            </button>

        </div>

    </form>

    <div class="home-cta-row">

        <a href="{% url 'register' %}" class="btn-cta-primary">
            Create free account
        </a>

        <a href="{% url 'login' %}" class="btn-cta-ghost">
            Log in
        </a>

    </div>

</div>

{% endblock %}
