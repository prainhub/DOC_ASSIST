{% extends "base.html" %}

{% block title %}Create Account — DOCASSIST{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-brand">
            <div class="auth-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h4l1.5-4 3 9 3-14 2.5 9h2.5l1.5-3 1 3H22"/>
                </svg>
            </div>
            <span class="auth-brand-name">DOCASSIST</span>
        </div>

        <h2>Create your account</h2>
        <p class="auth-sub">Start chatting with your documents in seconds.</p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" id="registerForm">
            {% csrf_token %}

            <div class="auth-group">
                <label class="auth-label" for="regUsername">Username</label>
                <input class="auth-input" type="text" name="username" id="regUsername"
                       placeholder="Choose a username" required autocomplete="username">
            </div>

            <div class="auth-group">
                <label class="auth-label" for="regEmail">Email <span style="color:var(--text-dim); font-size:11px;">(optional)</span></label>
                <input class="auth-input" type="email" name="email" id="regEmail"
                       placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="auth-group">
                <label class="auth-label" for="regPassword">Password</label>
                <input class="auth-input" type="password" name="password" id="regPassword"
                       placeholder="Create a password" required autocomplete="new-password">
            </div>

            <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>

    </div>
</div>

{% endblock %}
