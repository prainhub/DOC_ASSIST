{% extends "base.html" %}

{% block title %}Sign In — DOCASSIST{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-brand">
            <div class="auth-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12h4l1.5-4 3 9 3-14 2.5 9h2.5l1.5-3 1 3H22"/>
                </svg>
            </div>
            <span class="auth-brand-name">DOCASSIST</span>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-sub">Sign in to continue to your workspace.</p>

        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <div class="auth-group">
                <label class="auth-label" for="loginUsername">Username</label>
                <input class="auth-input" type="text" name="username" id="loginUsername"
                       placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="auth-group">
                <label class="auth-label" for="loginPassword">Password</label>
                <input class="auth-input" type="password" name="password" id="loginPassword"
                       placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="auth-submit">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Get started</a>
        </div>

    </div>
</div>

{% endblock %}
